<header><div class="eyebrow">METASURFACE.IR · <span data-en="CHAPTER 7" data-fa="فصل ۷"></span></div><h1 data-en="From a voltage to a wavefront" data-fa="از ولتاژ تا جبهه‌موج"></h1><p data-en="Explore a tunable equivalent circuit, a programmed scalar array, and the dynamics of its control. Every plot uses the executed notebook reference." data-fa="مدار معادل تنظیم‌پذیر، آرایهٔ اسکالر برنامه‌ریزی‌شده و دینامیک کنترل آن را کاوش کنید. همهٔ نمودارها از مرجع دفترچهٔ اجراشده می‌آیند."></p><span class="badge" data-en="Analytical and synthetic models" data-fa="مدل‌های تحلیلی و مصنوعی"></span></header>
<nav role="tablist" aria-label="Investigations"><button role="tab" data-view="cell" aria-selected="true" data-en="1 · Tune a cell" data-fa="۱ · تنظیم سلول"></button><button role="tab" data-view="array" aria-selected="false" data-en="2 · Program an array" data-fa="۲ · برنامه‌ریزی آرایه"></button><button role="tab" data-view="time" aria-selected="false" data-en="3 · Switch in time" data-fa="۳ · کلیدزنی زمانی"></button><button role="tab" data-view="feedback" aria-selected="false" data-en="4 · Check feedback" data-fa="۴ · بررسی بازخورد"></button></nav>
<section id="cell" role="tabpanel">
<div class="panel"><div class="controls"><label><span data-en="Bias (V)" data-fa="بایاس (ولت)"></span><input id="bias" type="range" min="0" max="400" step="1" value="160" aria-label="Bias"><output id="bias-value"></output></label><label><span data-en="Frequency (GHz)" data-fa="فرکانس (گیگاهرتز)"></span><select id="frequency"><option>7</option><option>8</option><option>9</option><option selected>10</option><option>11</option><option>12</option><option>13</option></select></label></div><p class="note" data-en="Move the bias through resonance. The amplitude and phase change together; a voltage command is not an independent phase command." data-fa="بایاس را از تشدید عبور دهید. دامنه و فاز با هم تغییر می‌کنند؛ فرمان ولتاژ، فرمان مستقل فاز نیست."></p><svg id="cell-geometry" viewBox="0 0 760 200" role="img" aria-label="Conceptual tunable patch and grounded section"></svg><p class="note" data-en="Symbolic split patch and grounded section. Effective R, L and C are assigned directly; no geometry-to-circuit extraction or full-wave patch simulation is claimed." data-fa="وصلهٔ شکاف‌دار و مقطع زمین‌دار نمادین هستند. R، L و C مؤثر مستقیماً تعیین شده‌اند؛ استخراج مدار از هندسه یا حل تمام‌موج وصله انجام نشده است."></p></div>
<div class="stats"><div class="stat"><span data-en="Reflection fraction |Γ|²" data-fa="سهم بازتاب |Γ|²"></span><strong id="reflectance"></strong></div><div class="stat"><span data-en="Unwrapped phase (degrees)" data-fa="فاز گشوده (درجه)"></span><strong id="cell-phase"></strong></div><div class="stat"><span data-en="Effective capacitance (pF)" data-fa="ظرفیت مؤثر (پیکوفاراد)"></span><strong id="capacitance"></strong></div></div>
<div class="grid"><div class="panel"><h2 data-en="Reachable complex states" data-fa="حالت‌های مختلط دسترس‌پذیر"></h2><svg id="trajectory" viewBox="0 0 620 360" role="img"></svg></div><div class="panel"><h2 data-en="Phase follows bias" data-fa="وابستگی فاز به بایاس"></h2><svg id="phase-chart" viewBox="0 0 620 360" role="img"></svg></div></div>
<p class="formula">Zs = R + i(1/ωC − ωL) · Γ = (Zs − Z₀)/(Zs + Z₀) · A + |Γ|² = 1</p>
</section>
<section id="array" role="tabpanel" hidden><div class="panel"><div class="controls"><label><span data-en="Target angle" data-fa="زاویهٔ هدف"></span><input id="target" type="range" min="-40" max="40" step="5" value="25" aria-label="Target angle"><output id="target-value"></output></label><label><span data-en="Codebook" data-fa="کدنامه"></span><select id="codebook"><option value="ideal1" data-en="Ideal 1 bit" data-fa="۱ بیت ایده‌آل"></option><option value="ideal2" data-en="Ideal 2 bit" data-fa="۲ بیت ایده‌آل"></option><option value="ideal4" data-en="Ideal 4 bit" data-fa="۴ بیت ایده‌آل"></option><option value="circuit4" selected data-en="Circuit: 16 voltages" data-fa="مدار: ۱۶ ولتاژ"></option></select></label></div><p class="note" data-en="32 prescribed sources, half-wavelength pitch at 10 GHz. The same color denotes the same commanded state. Circuit mode shows its actual voltage commands; ideal states have no assigned hardware voltage." data-fa="۳۲ منبع تجویزی با گام نصف طول موج در ۱۰ گیگاهرتز. رنگ یکسان یعنی حالت فرمان یکسان. حالت مداری ولتاژ واقعی فرمان را نشان می‌دهد؛ حالت ایده‌آل ولتاژ سخت‌افزاری تعیین‌شده ندارد."></p><svg id="array-geometry" viewBox="0 0 760 200" role="img"></svg><p id="array-state-note" class="note"></p></div><div class="stats"><div class="stat"><span data-en="Target metric |F(θtarget)|²" data-fa="معیار جهت هدف |F(θtarget)|²"></span><strong id="target-metric"></strong></div><div class="stat"><span data-en="Largest sampled peak angle" data-fa="زاویهٔ بزرگ‌ترین قلهٔ نمونه‌برداری‌شده"></span><strong id="peak-angle"></strong></div><div class="stat"><span data-en="Control states" data-fa="حالت‌های کنترل"></span><strong id="state-count"></strong></div></div><div class="panel"><h2 data-en="Aperture pattern with a common reference" data-fa="الگوی دهانه با مرجع مشترک"></h2><svg id="array-chart" viewBox="0 0 620 360" role="img"></svg><div class="key"><span style="--c:#087f83" data-en="Selected codebook" data-fa="کدنامهٔ انتخاب‌شده"></span><span style="--c:#b36b10" data-en="Ideal 4-bit comparison" data-fa="مقایسهٔ ۴ بیت ایده‌آل"></span></div><p class="note" data-en="The ordinate is 10 log10 |F|² relative to N coherent unit sources. It is not efficiency or directivity. One-bit patterns can have equally strong mirror peaks; the reported peak is the first sampled maximum." data-fa="محور عمودی 10 log10 |F|² نسبت به N منبع واحد همدوس است؛ بازده یا جهت‌مندی نیست. الگوی یک‌بیتی می‌تواند قلهٔ آینه‌ای هم‌قدرت داشته باشد؛ مقدار گزارش‌شده نخستین بیشینهٔ نمونه‌برداری‌شده است."></p></div></section>
<section id="time" role="tabpanel" hidden><div class="panel"><h2 data-en="A finite settling time changes the response" data-fa="زمان نشست متناهی پاسخ را تغییر می‌دهد"></h2><p data-en="Reference driver τ = 4 μs; a 2 → 14 V step. The 2% voltage settling time is 15.648 μs. The phase is calculated from the nonlinear circuit at each instantaneous bias." data-fa="مرجع راه‌انداز τ = 4 میکروثانیه و پلهٔ ۲ به ۱۴ ولت است. زمان نشست ۲٪ ولتاژ ۱۵٫۶۴۸ میکروثانیه است. فاز در هر بایاس لحظه‌ای از مدار غیرخطی محاسبه می‌شود."></p><div class="grid"><svg id="step-chart" viewBox="0 0 620 360" role="img"></svg><svg id="step-phase-chart" viewBox="0 0 620 360" role="img"></svg></div></div><div class="grid"><div class="panel"><h2 data-en="Repeated command: 20 kHz" data-fa="فرمان تکراری: ۲۰ کیلوهرتز"></h2><svg id="period-chart" viewBox="0 0 620 360" role="img"></svg><div class="key"><span style="--c:#087f83" data-en="RC voltage" data-fa="ولتاژ RC"></span><span style="--c:#b36b10" data-en="Command" data-fa="فرمان"></span></div></div><div class="panel"><h2 data-en="Sideband envelope weights" data-fa="وزن طیفی نوارهای جانبی"></h2><svg id="harmonic-chart" viewBox="0 0 620 360" role="img"></svg><div class="key"><span style="--c:#087f83" data-en="Finite RC response" data-fa="پاسخ RC متناهی"></span><span style="--c:#b36b10" data-en="Instantaneous binary states" data-fa="حالت‌های دودویی آنی"></span></div></div></div><p class="note" data-en="fℓ = 10 GHz + ℓ × 20 kHz. These are slow-envelope Fourier weights, not a full modulated-device power budget. Electromagnetic transients, pump work and sideband port normalization are outside this model." data-fa="fℓ = 10 GHz + ℓ × 20 kHz. این‌ها وزن فوریهٔ پوش آهسته‌اند، نه حساب کامل توان قطعهٔ مدوله‌شده. گذرای الکترومغناطیسی، کار پمپ و بهنجارسازی درگاه نوار جانبی بیرون مدل هستند."></p></section>
<section id="feedback" role="tabpanel" hidden><div class="panel"><h2 data-en="Inspect the saved calibration queries" data-fa="بررسی پرس‌وجوهای ذخیره‌شدهٔ کالیبراسیون"></h2><p data-en="The synthetic plant has 12% higher C₀. The controller knows only the returned complex response. A coarse scan followed by bounded refinement seeks the nominal 8 V target." data-fa="C₀ سامانهٔ مصنوعی ۱۲٪ بیشتر است. کنترل‌گر فقط پاسخ مختلط برگشتی را می‌داند. جاروب اولیه و پالایش کراندار، هدف اسمی ۸ ولت را جست‌وجو می‌کنند."></p><div class="controls"><label><span data-en="Saved measurement query" data-fa="پرس‌وجوی اندازه‌گیری ذخیره‌شده"></span><input id="query" type="range" min="0" max="25" value="25" step="1" aria-label="Calibration query"><output id="query-value"></output></label></div></div><div class="stats"><div class="stat"><span data-en="Queried bias (V)" data-fa="بایاس پرس‌وجو (ولت)"></span><strong id="query-bias"></strong></div><div class="stat"><span data-en="Squared complex error" data-fa="مربع خطای مختلط"></span><strong id="query-error"></strong></div><div class="stat"><span data-en="Best bias so far (V)" data-fa="بهترین بایاس تا این مرحله (ولت)"></span><strong id="best-bias"></strong></div></div><div class="panel"><svg id="feedback-chart" viewBox="0 0 620 360" role="img"></svg><p class="note" data-en="The independent equal-capacitance prediction is 9.08 V. This noiseless, one-parameter example does not demonstrate noisy hardware robustness or global optimality for an arbitrary plant. The browser inspects saved queries; it does not contact hardware." data-fa="پیش‌بینی مستقل ظرفیت برابر، ۹٫۰۸ ولت است. مثال بدون نویز و تک‌پارامتری، مقاومت سخت‌افزاری در برابر نویز یا بهینگی سراسری سامانهٔ دلخواه را ثابت نمی‌کند. مرورگر پرس‌وجوهای ذخیره‌شده را نمایش می‌دهد و به سخت‌افزار متصل نیست."></p></div></section>
<footer data-en="Original teaching tool · Shared executed data in both languages · No external scripts or network requests required after loading." data-fa="ابزار آموزشی اصیل · دادهٔ اجراشدهٔ مشترک در دو زبان · پس از بارگذاری، بدون اسکریپت خارجی یا درخواست شبکه."></footer>

if(FA){document.documentElement.dir='rtl';document.title='فراسطوح تنظیم‌پذیر | Metasurface.ir';}
const tr=(a,b)=>FA?b:a;
document.querySelectorAll('[data-en]').forEach(el=>el.textContent=el.dataset[FA?'fa':'en']);

 for(let j=0;j<=4;j++){let x=xlim[0]+j*(xlim[1]-xlim[0])/4,y=ylim[0]+j*(ylim[1]-ylim[0])/4;node(svg,'line',{x1:X(x),y1:35,x2:X(x),y2:300,stroke:'#e5ecef'});node(svg,'line',{x1:left,y1:Y(y),x2:right,y2:Y(y),stroke:'#e5ecef'});node(svg,'text',{x:X(x),y:325,'text-anchor':'middle'},Number(x.toFixed(2)));node(svg,'text',{x:left-11,y:Y(y)+5,'text-anchor':'end'},Number(y.toFixed(2)));}
 for(const [si,s] of series.entries()){if(id==='harmonic-chart'){s.x.forEach((x,i)=>{const xx=X(x+(si===0?-.13:.13));node(svg,'line',{x1:xx,x2:xx,y1:Y(0),y2:Y(s.y[i]),stroke:s.color||'#087f83','stroke-width':2});node(svg,'circle',{cx:xx,cy:Y(s.y[i]),r:3,fill:s.color||'#087f83'});});continue;}const pts=s.x.map((x,i)=>X(x)+','+Y(Math.max(ylim[0],Math.min(ylim[1],s.y[i])))).join(' ');node(svg,'polyline',{points:pts,fill:'none',stroke:s.color||'#087f83','stroke-width':2.5,'stroke-dasharray':s.dash||''});}
 for(const p of points)node(svg,'circle',{cx:X(p.x),cy:Y(p.y),r:6,fill:p.color||'#b36b10',stroke:'white','stroke-width':1.5});
 node(svg,'text',{x:330,y:354,'text-anchor':'middle'},xlabel);node(svg,'text',{x:15,y:165,'text-anchor':'middle',transform:'rotate(-90 15 165)'},ylabel);

 for(const x of [158,172])node(svg,'line',{x1:x,y1:77,x2:x,y2:113,stroke:'#087f83','stroke-width':4});

 node(svg,'rect',{x:390,y:105,width:335,height:45,fill:'#dfe8ee'});node(svg,'rect',{x:390,y:150,width:335,height:7,fill:'#7f8d98'});
 node(svg,'rect',{x:420,y:96,width:100,height:9,fill:'#c8a06b'});node(svg,'rect',{x:580,y:96,width:115,height:9,fill:'#c8a06b'});
 node(svg,'text',{x:550,y:187,'text-anchor':'middle'},tr('Ground-backed section','مقطع زمین‌دار'));
 node(svg,'path',{d:'M 465 20 L 465 82 M 459 70 L 465 82 L 471 70 M 630 82 L 630 20 M 624 32 L 630 20 L 636 32',fill:'none',stroke:'#087f83','stroke-width':3});
 node(svg,'text',{x:490,y:34,'text-anchor':'middle'},'Eᵢ');node(svg,'text',{x:665,y:34,'text-anchor':'middle'},'ΓEᵢ');

function cell(){const index=Number(el('bias').value),f=Number(el('frequency').value),v=DATA.voltage[index],c=DATA.cell_curves.find(c=>c.frequency_GHz===f),p=DATA.metadata.parameters;
 el('bias-value').textContent=v.toFixed(2)+' V';el('reflectance').textContent=c.reflected[index].toFixed(4);el('cell-phase').textContent=c.phase[index].toFixed(2)+'°';el('capacitance').textContent=(p.capacitance0_pF/(1+v/p.junction_voltage_V)**p.exponent).toFixed(5);drawCell(v);

 node(svg,'text',{x:380,y:174,'text-anchor':'middle'},tr('Source index j · pitch = λ₀/2 · f₀ = 10 GHz','شمارهٔ منبع j · گام = λ₀/2 · f₀ = 10 GHz'));

 plot('array-chart',[{x:DATA.angles,y:ideal.intensity.map(v=>10*Math.log10(Math.max(v,1e-6))),color:'#b36b10',dash:'5 4'},{x:DATA.angles,y:d.intensity.map(v=>10*Math.log10(Math.max(v,1e-6)))}],[-80,80],[-45,1],tr('Signed angle (degrees)','زاویهٔ علامت‌دار (درجه)'),'10 log₁₀ |F|² (dB)');
}
function time(){const d=DATA.dynamics;plot('step-chart',[{x:d.time_us,y:d.voltage}],[0,24],[0,16],tr('Time (μs)','زمان (میکروثانیه)'),tr('Bias (V)','بایاس (ولت)'));plot('step-phase-chart',[{x:d.time_us,y:d.phase}],[0,24],[-330,0],tr('Time (μs)','زمان (میکروثانیه)'),tr('Unwrapped phase (degrees)','فاز گشوده (درجه)'));plot('period-chart',[{x:d.cycle,y:d.cycle.map(u=>u<.5?3:14),color:'#b36b10',dash:'5 4'},{x:d.cycle,y:d.period_voltage}],[0,1],[0,16],'t/T',tr('Bias (V)','بایاس (ولت)'));plot('harmonic-chart',[{x:d.orders,y:d.fast_weights,color:'#b36b10',dash:'5 4'},{x:d.orders,y:d.slow_weights}],[-10,10],[0,Math.max(...d.fast_weights,...d.slow_weights)*1.15],tr('Sideband index ℓ','شمارهٔ نوار جانبی ℓ'),'|cℓ|²');}
function feedback(){const records=DATA.feedback.queries,index=Number(el('query').value),row=records[index];let best=records.slice(0,index+1).reduce((a,b)=>a.error_squared<b.error_squared?a:b);el('query-value').textContent=(index+1)+' / '+records.length;el('query-bias').textContent=row.voltage_V.toFixed(6);el('query-error').textContent=row.error_squared.toExponential(3);el('best-bias').textContent=best.voltage_V.toFixed(6);plot('feedback-chart',[{x:records.map((r,i)=>i+1),y:records.map(r=>Math.log10(Math.max(r.error_squared,1e-20)))}],[1,records.length],[-20,1],tr('Measurement query','پرس‌وجوی اندازه‌گیری'),'log₁₀ |Γmeas − Γtarget|²',[{x:index+1,y:Math.log10(Math.max(row.error_squared,1e-20))}]);}
el('query').max=DATA.feedback.queries.length-1;el('query').value=el('query').max;
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',String(b===button)));document.querySelectorAll('[role=tabpanel]').forEach(p=>p.hidden=p.id!==button.dataset.view);}));
const tabs=Array.from(document.querySelectorAll('[data-view]'));
document.querySelector('[role=tablist]').setAttribute('aria-label',tr('Investigations','بررسی‌ها'));
tabs.forEach((button,i)=>{button.id='tab-'+button.dataset.view;button.setAttribute('aria-controls',button.dataset.view);el(button.dataset.view).setAttribute('aria-labelledby',button.id);button.addEventListener('keydown',event=>{let next;if(event.key==='ArrowRight')next=(i+1)%tabs.length;else if(event.key==='ArrowLeft')next=(i+tabs.length-1)%tabs.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=tabs.length-1;else return;event.preventDefault();tabs[next].focus();tabs[next].click();});});
for(const id of ['bias','frequency'])el(id).addEventListener('input',cell);for(const id of ['target','codebook'])el(id).addEventListener('input',array);el('query').addEventListener('input',feedback);
window.tunableReference=DATA;cell();array();time();feedback();
