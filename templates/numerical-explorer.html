 xt.forEach(v=>{html+=`<path d="M${X(v)} ${y0}v5" stroke="#9eb6c7"/><text x="${X(v)}" y="${y0+22}" text-anchor="middle">${Number(v.toPrecision(5))}</text>`;});
 if(options.selectedX!==undefined)html+=`<path d="M${X(options.selectedX)} ${y1}V${y0}" stroke="#7a94a5" stroke-dasharray="4 4"/>`;
 series.forEach(s=>{const path=s.points.map((p,i)=>(i?'L':'M')+X(p.x)+','+Y(p.y)).join(' ');html+=`<path d="${path}" clip-path="url(#clip-${id})" fill="none" stroke="${s.color}" stroke-width="${s.width||2.3}" ${s.dash?'stroke-dasharray="6 4"':''}/>`;if(s.dots)s.points.forEach(p=>{html+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="2.8" fill="${s.color}"/>`;});if(options.selectedX!==undefined){const p=s.points.find(p=>p.x===options.selectedX);if(p)html+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="${s.color}" stroke="white" stroke-width="1.5"/>`;}});
 html+=`<path d="M${x0} ${y1}V${y0}H${x1}" fill="none" stroke="#9eb6c7"/><text x="${(x0+x1)/2}" y="${H-10}" text-anchor="middle">${esc(options.xlabel)}</text><text transform="translate(17 ${(y0+y1)/2}) rotate(-90)" text-anchor="middle">${esc(options.ylabel)}</text>`;
 svg.innerHTML=html;svg.setAttribute('aria-label',options.alt);
}
function updateGeometry(n,padding){
 const fa=document.documentElement.lang==='fa';
 $('geometry-title').textContent=fa?'چه ساختاری را حل می‌کنیم؟':'What structure are we solving?';
 $('geometry').innerHTML=BookGeometry.slab(data.metadata.parameters,n,padding,fa?'fa':'en');
 $('geometry-caption').textContent=fa?'این آزمون، لایهٔ تخت نامتناهی است و سلول نقش‌دار نیست. نمودار میدان، میدان همین لایه را در راستای z نشان می‌دهد. تغییر N فقط تعداد گره‌های عددی را تغییر می‌دهد؛ ضخامت و ماده ثابت‌اند. فاصلهٔ مرز در پایین شکل با مقدار واقعی ثبت می‌شود.':'This benchmark is an infinite uniform film. The field plot shows the field through this same slab along z. Changing N changes numerical nodes, not the material or thickness. Exterior padding distances are recorded beneath the drawing; the 3D cut is illustrative.';
}
let active='mesh';
function updateMesh(){updateGeometry(Number(data.mesh[Number($('mesh').value)].cells),0);const row=data.mesh[Number($('mesh').value)],N=row.cells,pass=row.complex_t_error<=data.metadata.thresholds.default_complex_t;$('mesh-value').textContent=N+' · h='+format(row.step_um,6)+' µm';$('mesh').setAttribute('aria-valuetext',N+' '+tr.cells);$('mesh-error').textContent=format(row.complex_t_error);$('mesh-phase').textContent=format(row.phase_error_deg,3)+'°';$('mesh-energy').textContent=format(row.energy_defect);$('mesh-residual').textContent=format(row.algebraic_residual);$('mesh-status').textContent=pass?tr.meshPass:tr.meshFail;$('mesh-status').className='notice'+(pass?' pass':'');$('mesh-error-box').className='metric '+(pass?'good':'bad');$('mesh-response').textContent=`${tr.response}: R=${format(row.R)} · T=${format(row.T_net)} · t=${format(row.t_real)} ${row.t_imag<0?'−':'+'} ${format(Math.abs(row.t_imag))}i · ${tr.phase}=${format(row.phase_deg,3)}°`;
 chart('mesh-chart',[{color:'#087f8c',points:data.mesh.map(r=>({x:r.cells,y:r.complex_t_error}))},{color:'#d18536',points:data.mesh.map(r=>({x:r.cells,y:r.energy_defect}))},{color:'#8064a2',points:data.mesh.map(r=>({x:r.cells,y:r.algebraic_residual}))}],{logX:true,logY:true,ylim:[1e-17,1],xticks:data.mesh.map(r=>r.cells),yticks:[1e-16,1e-12,1e-8,1e-4,1],selectedX:N,xlabel:tr.meshAxis,ylabel:tr.errorAxis,alt:tr.meshChartAlt});}
data.fields.forEach(f=>{const option=document.createElement('option');option.value=f.cells;option.textContent='N = '+f.cells;$('field').appendChild(option);});$('field').value='8';
function updateField(){const f=data.fields.find(f=>f.cells===Number($('field').value)),series=[{color:'#087f8c',points:f.z_um.map((x,i)=>({x,y:f.E_real[i]})),dots:f.cells===8}];if($('show-exact').checked)series.push({color:'#d18536',points:f.z_um.map((x,i)=>({x,y:f.exact_E_real[i]})),dash:true});const d=data.metadata.parameters.thickness_um;chart('field-chart',series,{xticks:[-d/2,0,d/2,d,1.5*d],xlabel:tr.position,ylabel:tr.realField,alt:tr.fieldChartAlt});}
const scenarios={matched:['discrete','discrete','matchedDescription'],mismatch:['continuum','discrete','mismatchDescription'],wrong:['discrete','continuum','wrongDescription']};
function selectedPadding(){const s=scenarios[$('scenario').value];return data.padding.filter(r=>r.boundary===s[0]&&r.deembed===s[1]);}
function updatePadding(){updateGeometry(8,Number($('padding').value));const rows=selectedPadding(),p=Number($('padding').value),row=rows.find(r=>r.padding_cells===p),scenario=$('scenario').value;$('padding-value').textContent=p+' · '+format(row.padding_um,3)+' µm';$('padding').setAttribute('aria-valuetext',p+' '+tr.cells);$('scenario-description').textContent=tr[scenarios[scenario][2]];$('padding-error').textContent=format(row.complex_t_vs_matched);$('padding-phase').textContent=format(row.phase_drift_deg,3)+'°';$('padding-backward').textContent=format(row.T_backward);$('padding-energy').textContent=format(row.energy_defect);$('padding-response').textContent=`R=${format(row.R,6)} · ${tr.forward}=${format(row.T_forward,6)} · ${tr.net}=${format(row.T_net,6)}`+(scenario==='wrong'?` · ${tr.predicted}=${format(row.predicted_deembed_drift_deg,3)}°`:'');
 chart('reflection-chart',[{color:'#087f8c',points:rows.map(r=>({x:r.padding_cells,y:r.R}))}],{selectedX:p,ydigits:6,xlabel:tr.paddingAxis,ylabel:tr.reflection,alt:tr.reflectionChartAlt});chart('phase-chart',[{color:scenario==='wrong'?'#d18536':'#087f8c',points:rows.map(r=>({x:r.padding_cells,y:r.phase_drift_deg}))}],{selectedX:p,ydigits:3,xlabel:tr.paddingAxis,ylabel:tr.phaseAxis,alt:tr.phaseChartAlt});}
function activate(mode){active=mode;if(mode==='mesh')updateGeometry(data.mesh[Number($('mesh').value)].cells,0);else updateGeometry(8,Number($('padding').value));['mesh','padding'].forEach(id=>{const on=id===mode;$('tab-'+id).setAttribute('aria-selected',String(on));$('tab-'+id).tabIndex=on?0:-1;$('panel-'+id).hidden=!on;});}
['mesh','padding'].forEach(id=>{$('tab-'+id).addEventListener('click',()=>activate(id));$('tab-'+id).addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const target=event.key==='Home'?'mesh':event.key==='End'?'padding':active==='mesh'?'padding':'mesh';activate(target);$('tab-'+target).focus();}});});
$('mesh').addEventListener('input',updateMesh);$('field').addEventListener('change',updateField);$('show-exact').addEventListener('change',updateField);$('scenario').addEventListener('change',updatePadding);$('padding').addEventListener('input',updatePadding);
const parameters=data.metadata.parameters;$('model-parameters').textContent=`λ₀ = ${parameters.wavelength_um} µm · d = ${parameters.thickness_um} µm · n_film = ${parameters.n_film} · n_exterior = ${parameters.n_exterior} · exp(−iωt)`;$('provenance').textContent=`${tr.source}: ${data.metadata.model}. ${tr.exactValue}: ${format(data.metadata.exact.t.real,7)} ${data.metadata.exact.t.imag<0?'−':'+'} ${format(Math.abs(data.metadata.exact.t.imag),7)}i. ${tr.hash}: ${data.metadata.source_sha256['numerical_methods.py']}`;
$('download').addEventListener('click',()=>{const result=active==='mesh'?data.mesh[Number($('mesh').value)]:selectedPadding().find(r=>r.padding_cells===Number($('padding').value));const blob=new Blob([JSON.stringify({metadata:data.metadata,view:active,result},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download='chapter06-'+active+'-result.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
updateMesh();updateField();updatePadding();updateGeometry(data.mesh[Number($('mesh').value)].cells,0);
</script>
