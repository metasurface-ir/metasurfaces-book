<style>
:root{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;color:#173247;background:#edf3f7;font-size:16px;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1150px;margin:auto}.eyebrow{font-size:.76rem;font-weight:750;letter-spacing:.08em;color:#187780}h1{font-size:clamp(1.8rem,4vw,2.75rem);letter-spacing:-.025em;line-height:1.15;margin:10px 0}h2{font-size:1.17rem;margin:0 0 12px}h3{font-size:1rem;margin:0 0 12px}p{line-height:1.65}.sub,.small{color:#536a7b}.sub{max-width:820px}.small{font-size:.84rem}.top{display:flex;justify-content:space-between;align-items:start;gap:16px}.badge{padding:8px 11px;background:#e1eef0;border-radius:7px;white-space:nowrap;font-size:.8rem;font-weight:700}.tabs{display:flex;gap:8px;margin:22px 0 16px;flex-wrap:wrap}button,select{font:inherit}button{border:1px solid #b6cbd7;border-radius:8px;padding:10px 15px;background:white;color:#21465b;cursor:pointer}button[aria-selected=true]{background:#146d78;border-color:#146d78;color:white}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d99422;outline-offset:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #d5e2ea;border-radius:14px;padding:20px;min-width:0}.wide{grid-column:1/-1}.controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap}label{display:block;font-weight:650;line-height:1.5}input[type=range]{width:100%;accent-color:#137b84;margin:14px 0}input[type=checkbox]{accent-color:#137b84;min-width:19px;min-height:19px}.check{display:flex;gap:9px;align-items:center;font-weight:500}select{padding:9px 12px;border:1px solid #a8bfce;border-radius:6px;background:#fff;color:#173247;max-width:100%}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.metric{background:#f0f5f8;border:1px solid #dfE8ee;border-radius:10px;padding:12px;min-width:0}.metric span{display:block;color:#4c6577;font-size:.77rem;line-height:1.5}.metric strong{display:block;font-size:clamp(1rem,2vw,1.35rem);margin-top:7px;direction:ltr;text-align:start;font-variant-numeric:tabular-nums}.metric.good{border-color:#9acfc2;background:#eef8f3}.metric.bad{border-color:#e8ba89;background:#fff4e8}.notice{padding:11px 14px;border-inline-start:4px solid #cf8b35;background:#fff6e9;font-size:.88rem;line-height:1.6}.notice.pass{border-color:#29836d;background:#edf8f2}.plot{display:block;width:100%;height:auto;direction:ltr}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.77rem;margin:10px 0;color:#4c6577}.legend span:before{content:"";display:inline-block;width:14px;height:3px;margin-inline-end:5px;background:var(--swatch);vertical-align:middle}.plot text{font-family:system-ui,Tahoma,sans-serif;fill:#536a7b;font-size:11px}output{font-variant-numeric:tabular-nums}.inline-data{direction:ltr;unicode-bidi:isolate;display:inline-block}.foot{margin-top:20px}#provenance{overflow-wrap:anywhere}.model{background:#e6f0f4;border-radius:8px;padding:11px 14px;margin-top:16px;line-height:1.7}.nowrap{white-space:nowrap}details{margin-top:15px}summary{cursor:pointer;font-weight:650}[hidden]{display:none!important}html[dir=rtl] h1{letter-spacing:0}html[dir=rtl] .eyebrow{letter-spacing:0}@media(max-width:760px){body{padding:14px}.grid{grid-template-columns:1fr}.wide{grid-column:1}.metrics{grid-template-columns:1fr 1fr}.card{padding:16px}.top{display:block}.badge{display:inline-block;margin-top:8px}.controls{gap:10px}h1{line-height:1.3}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.geometry-view{max-width:740px;margin:14px auto}.geometry-view svg{max-width:740px}.geometry-caption{font-size:.86rem;line-height:1.7;overflow-wrap:anywhere}.geometry-view text{font-size:19px}</style>
<main>
<div class="top"><div><div class="eyebrow" data-i18n="eyebrow"></div><h1 data-i18n="title"></h1></div><div class="badge" data-i18n="offline"></div></div>
<p class="sub" data-i18n="intro"></p>
<section class="card"><h2 id="geometry-title"></h2><div id="geometry" class="geometry-view"></div><p id="geometry-caption" class="geometry-caption" dir="auto"></p></section>
<div class="tabs" role="tablist" aria-label="Numerical investigations"><button id="tab-mesh" role="tab" aria-selected="true" aria-controls="panel-mesh" data-i18n="meshTab"></button><button id="tab-padding" role="tab" aria-selected="false" aria-controls="panel-padding" tabindex="-1" data-i18n="paddingTab"></button></div>
<section id="panel-mesh" role="tabpanel" aria-labelledby="tab-mesh">
<div class="grid">
<section class="card wide"><h2 data-i18n="chooseMesh"></h2><label for="mesh"><span data-i18n="filmCells"></span> <output id="mesh-value" class="inline-data"></output></label><input id="mesh" type="range" min="0" max="7" value="0" step="1"><div id="mesh-status" class="notice" aria-live="polite"></div>
<div class="metrics"><div id="mesh-error-box" class="metric"><span data-i18n="complexError"></span><strong id="mesh-error"></strong></div><div class="metric"><span data-i18n="phaseError"></span><strong id="mesh-phase"></strong></div><div class="metric good"><span data-i18n="energyDefect"></span><strong id="mesh-energy"></strong></div><div class="metric good"><span data-i18n="residual"></span><strong id="mesh-residual"></strong></div></div><p id="mesh-response" class="small"></p></section>
<section class="card"><h2 data-i18n="convergence"></h2><svg id="mesh-chart" class="plot" viewBox="0 0 620 330" role="img"></svg><div class="legend"><span style="--swatch:#087f8c" data-i18n="complexError"></span><span style="--swatch:#d18536" data-i18n="energyDefect"></span><span style="--swatch:#8064a2" data-i18n="residual"></span></div><p class="small" data-i18n="logNote"></p></section>
<section class="card"><h2 data-i18n="fieldTitle"></h2><div class="controls"><label for="field" data-i18n="fieldMesh"></label><select id="field"></select><label class="check" for="show-exact"><input id="show-exact" type="checkbox" checked><span data-i18n="exactOverlay"></span></label></div><svg id="field-chart" class="plot" viewBox="0 0 620 330" role="img"></svg><div class="legend"><span style="--swatch:#087f8c" data-i18n="computedField"></span><span style="--swatch:#d18536" data-i18n="exactField"></span></div><p class="small" data-i18n="fieldNote"></p></section>
</div></section>
<section id="panel-padding" role="tabpanel" aria-labelledby="tab-padding" hidden>
<div class="grid"><section class="card wide"><h2 data-i18n="chooseBoundary"></h2><label for="scenario" data-i18n="scenario"></label><select id="scenario"><option value="matched" data-i18n="matched"></option><option value="mismatch" data-i18n="mismatch"></option><option value="wrong" data-i18n="wrong"></option></select><p id="scenario-description" class="small"></p><label for="padding"><span data-i18n="paddingEach"></span> <output id="padding-value" class="inline-data"></output></label><input id="padding" type="range" min="0" max="64" value="16" step="1"><div class="metrics"><div class="metric"><span data-i18n="matchedDifference"></span><strong id="padding-error"></strong></div><div class="metric"><span data-i18n="phaseDrift"></span><strong id="padding-phase"></strong></div><div class="metric"><span data-i18n="backwardPower"></span><strong id="padding-backward"></strong></div><div class="metric good"><span data-i18n="energyDefect"></span><strong id="padding-energy"></strong></div></div><p id="padding-response" class="small" aria-live="polite"></p><div class="notice" data-i18n="paddingWarning"></div></section>
<section class="card"><h2 data-i18n="reflectionChart"></h2><svg id="reflection-chart" class="plot" viewBox="0 0 620 330" role="img"></svg><p class="small" data-i18n="reflectionNote"></p></section><section class="card"><h2 data-i18n="phaseChart"></h2><svg id="phase-chart" class="plot" viewBox="0 0 620 330" role="img"></svg><p class="small" data-i18n="phaseNote"></p></section></div></section>
<section class="card foot"><h2 data-i18n="evidence"></h2><p data-i18n="scope"></p><div id="model-parameters" class="model"></div><p class="small" data-i18n="normalization"></p><details><summary data-i18n="provenance"></summary><p id="provenance" class="small"></p><p class="small" data-i18n="independent"></p></details></section>
</main>
<script>/* Original course schematics. Drawing only: no electromagnetic solver lives here.
 * Shared by exported SVG figures and offline interactive labs. Length inputs: um.
 */
(() => {
  'use strict';
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
  const f=x=>Number(x).toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
  const text=(x,y,s,extra='')=>`<text x="${x}" y="${y}" ${extra}>${esc(s)}</text>`;
  const line=(x1,y1,x2,y2,color='#647d90',extra='')=>`<path d="M${x1} ${y1}L${x2} ${y2}" fill="none" stroke="${color}" stroke-width="2" ${extra}/>`;
  const rect=(x,y,w,h,color,extra='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${color}" ${extra}/>`;
  const arrow=(x1,y1,x2,y2,color='#174b68')=>line(x1,y1,x2,y2,color,'marker-end="url(#geom-arrow)"');
  const dim=(x1,y1,x2,y2,label)=>line(x1,y1,x2,y2,'#4b6173','marker-start="url(#geom-dim)" marker-end="url(#geom-dim)"')+text((x1+x2)/2,(y1+y2)/2-9,label,'text-anchor="middle"');
  function svg(title,description,body,height=680){
    return `<svg xmlns="http://www.w3.org/2000/svg" class="model-geometry" viewBox="0 0 800 ${height}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title><desc>${esc(description)}</desc><defs><marker id="geom-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="geom-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M10 0L0 5L10 10" fill="none" stroke="#4b6173" stroke-width="1.5"/></marker></defs><style>.model-geometry{width:100%;height:auto;display:block;background:#f8fbfd;border-radius:12px;direction:ltr}.model-geometry text{font:19px Tahoma,Arial,sans-serif;fill:#23465c}.model-geometry .small{font-size:16px}.model-geometry .heading{font-size:21px;font-weight:700}.model-geometry .label{fill:#fff;font-weight:700}</style>${body}</svg>`;
  }
  const words=fa=>fa?{
    ridge:'سلول واحد تیغه‌ای دی‌الکتریک',supercell:'ابرسلول انحراف پرتو',view:'نمای سه‌بعدی؛ برش نمایشی در راستای y',section:'مقطع x–z و صفحه‌های مرجع',air:'محیط فرودی',substrate:'زیرلایه',periodic:'مرز تناوبی',repeat:'تکرار نامحدود در x',invariant:'ناوردا در y؛ ستون منفرد نیست',schematic:'طرح هندسی؛ مقیاس دیدها یکسان نیست',input:'تابش TE',reflected:'بازتاب r',transmitted:'عبور t',slab:'لایهٔ تخت برای آزمون عددی',slabView:'برش سه‌بعدی از لایهٔ نامحدود در x و y',mesh:'شبکه فقط در راستای z است',outgoing:'مرز تابشی گسسته',padding:'فاصلهٔ بیرونی',sheet:'ورقهٔ ایده‌آل؛ مدل تحلیلی',sheetView:'مدل دو‌درگاهی؛ هندسهٔ ذره تعیین نشده است',sheetNote:'نتیجهٔ این مدل، شبیه‌سازی ذرهٔ سه‌بعدی نیست',dimension:'ضخامت صفر؛ هر دو مرجع روی ورقه',node:'نقطه‌ها گرهٔ عددی‌اند؛ لایهٔ مادی نیستند'
  }:{ridge:'Dielectric ridge unit cell',supercell:'Beam-steering supercell',view:'3D view: illustrative cut along y',section:'x–z section and reference planes',air:'Incident medium',substrate:'Substrate',periodic:'Periodic boundary',repeat:'Repeats indefinitely along x',invariant:'Invariant along y; not isolated posts',schematic:'Schematic: views use different scales',input:'TE illumination',reflected:'Reflection r',transmitted:'Transmission t',slab:'Uniform slab: numerical benchmark',slabView:'3D cut: film extends indefinitely in x and y',mesh:'Only z is discretized',outgoing:'Discrete radiation boundary',padding:'Exterior padding',sheet:'Ideal sheet: analytical model',sheetView:'Two-port model; no particle geometry assigned',sheetNote:'This response is not a simulated 3D particle',dimension:'Zero thickness; both references on the sheet',node:'Dots are numerical nodes, not material layers'};
  function ridge(p,widths,language='en'){
    const w=words(language==='fa'),multi=widths.length>1,pitch=p.period_um||p.pitch_um,h=p.height_um,L=pitch*widths.length;
    const shown=multi?widths:[widths[0],widths[0],widths[0]],displayL=pitch*shown.length;
    let s=text(28,34,multi?w.supercell:w.ridge,'class="heading"')+text(28,62,w.view,'class="small"');
    // Orthographic extrusion with visible cut ends; material dimensions remain explicit.
    const scale=Math.min(570/displayL,155/h),span=displayL*scale,left=(800-span-75)/2,base=265,depth=64;
    const poly=(points,color)=>`<polygon points="${points.map(v=>v.join(',')).join(' ')}" fill="${color}" stroke="#4c758a" stroke-width="1.2"/>`;
    s+=poly([[left,base],[left+span,base],[left+span+depth,base-40],[left+depth,base-40]],'#d6e9f4');
    s+=poly([[left,base],[left+span,base],[left+span,base+23],[left,base+23]],'#a8cadf');
    for(let j=shown.length-1;j>=0;j--){
      const x=left+(j+.5)*pitch*scale-shown[j]*scale/2,rw=shown[j]*scale,top=base-h*scale;
      s+=poly([[x,top],[x+rw,top],[x+rw+depth,top-40],[x+depth,top-40]],'#68bfc0');
      s+=poly([[x+rw,top],[x+rw+depth,top-40],[x+rw+depth,base-40],[x+rw,base]],'#1b677b');
      s+=poly([[x,top],[x+rw,top],[x+rw,base],[x,base]],multi||j===1?'#16828c':'#86bfc4');
    }
    const a=multi?left:left+pitch*scale,b=multi?left+span:left+2*pitch*scale;
    for(const x of [a,b])s+=line(x,82,x,base+31,'#8b699b','stroke-dasharray="7 5"');
    s+=dim(a,310,b,310,`${multi?'L':'Λ'} = ${f(L)} µm`)+text(400,340,w.repeat+' · '+w.invariant,'text-anchor="middle" class="small"');
    s+=arrow(58,142,58,209)+text(79,162,'+z')+arrow(58,142,118,142)+text(126,148,'x')+arrow(58,142,89,119)+text(95,115,'y');
    s+=text(28,379,w.section,'class="heading"');
    const x0=110,x1=684,z0=464,z1=577,cell=(x1-x0)/widths.length;
    s+=rect(x0,408,x1-x0,z1-408,'#edf4f8')+rect(x0,z1,x1-x0,39,'#c3deed');
    for(let j=0;j<widths.length;j++){
      const rw=widths[j]/pitch*cell,x=x0+(j+.5)*cell-rw/2;
      s+=rect(x,z0,rw,z1-z0,'#16828c',`data-width-um="${widths[j]}"`);
      if(multi)s+=text(x0+(j+.5)*cell,z0+27,String(j+1),'text-anchor="middle" class="label small"');
    }
    s+=line(90,z0,710,z0,'#9a5e3d','stroke-dasharray="7 4"')+line(90,z1,710,z1,'#9a5e3d','stroke-dasharray="7 4"');
    for(const x of [x0,x1])s+=line(x,405,x,622,'#8b699b','stroke-dasharray="7 5"');
    s+=text(116,435,`${w.air}: nᵢ = ${f(p.n_incident)}`,'class="small"')+text(118,604,`${w.substrate}: nₜ = ${f(p.n_substrate)}`,'class="small"');
    s+=text(697,469,'z = 0','class="small"')+text(697,582,'z = h','class="small"');
    s+=arrow(315,409,315,459)+text(334,421,'kᵢ (+z)','class="small"')+text(334,444,'E ∥ y (TE)','class="small"');
    s+=arrow(560,455,560,409)+text(582,428,'r','class="heading"')+arrow(560,589,560,632)+text(582,627,'t','class="heading"');
    s+=dim(73,z0,73,z1,`h`)+dim(x0,648,x1,648,`${multi?'L = '+widths.length+'Λ':'Λ'} = ${f(L)} µm`);
    if(!multi)s+=dim((x0+x1)/2-widths[0]/pitch*cell/2,548,(x0+x1)/2+widths[0]/pitch*cell/2,548,'w');
    s+=text(28,691,`h = ${f(h)} µm · nᵣ = ${f(p.n_ridge)} · n_gap = ${f(p.n_gap)} · λ₀ = ${f(p.wavelength_um)} µm`,'class="small"');
    s+=text(28,721,`${multi?'wⱼ ≈':'w ='} ${widths.map(f).join(', ')} µm`,'class="small"');
    return svg(multi?w.supercell:w.ridge,w.invariant,s,744).replace('<svg ',`<svg data-model="${multi?'supercell':'ridge'}" data-height-um="${h}" data-period-um="${L}" `);
  }
  function slab(p,N=8,padding=0,language='en'){
    const w=words(language==='fa'),d=p.thickness_um,n=p.n_exterior;
    let s=text(28,34,w.slab,'class="heading"')+text(28,62,w.slabView,'class="small"');
    s+=`<path d="M180 105H585L665 70H260Z" fill="#8ed0cb" stroke="#247d87"/><path d="M180 105H585V245H180Z" fill="#24919b"/><path d="M585 105L665 70V210L585 245Z" fill="#1b667a"/>`;
    s+=text(370,182,`nᶠ = ${f(p.n_film)}`,'text-anchor="middle" class="label"')+dim(138,105,138,245,`d`);
    s+=arrow(390,75,390,101)+text(421,96,'kᵢ (+z)')+arrow(560,263,560,298)+text(584,288,'t');
    s+=text(400,334,`${w.mesh} · d = ${f(d)} µm`,'text-anchor="middle"');
    s+=text(28,377,w.section,'class="heading"');
    const left=140,right=660,top=441,bottom=552;
    s+=rect(left,397,right-left,bottom-397,'#eef5f8')+rect(left,top,right-left,bottom-top,'#9bd3ce')+rect(left,bottom,right-left,74,'#eef5f8');
    s+=text(155,426,`nₑ = ${f(n)}`)+text(155,503,`nᶠ = ${f(p.n_film)}`)+text(155,608,`nₑ = ${f(n)}`);
    for(const y of [top,bottom])s+=line(120,y,690,y,'#9a5e3d','stroke-dasharray="7 4"');
    s+=text(697,446,'z = 0','class="small"')+text(697,557,'z = d','class="small"');
    // Display a sparse subset for large N: positions still come from the actual grid.
    const indices=N<=16?Array.from({length:N+1},(_,i)=>i):[0,1,2,N/2,N-2,N-1,N];
    s+=line(400,409,400,603,'#6f7f91');
    for(const j of indices)s+=`<circle cx="400" cy="${top+(bottom-top)*j/N}" r="${N<=16?4:3}" fill="#173e58" data-node-index="${j}"/>`;
    const bcTop=padding?397:top,bcBottom=padding?626:bottom;
    s+=line(120,bcTop,690,bcTop,'#855696','stroke-dasharray="3 4"')+line(120,bcBottom,690,bcBottom,'#855696','stroke-dasharray="3 4"');
    s+=text(65,bcTop+5,'BC−','class="small"')+text(65,bcBottom+5,'BC+','class="small"');
    s+=arrow(560,401,560,435)+text(582,424,'kᵢ')+arrow(609,435,609,400)+text(628,424,'r')+arrow(560,564,560,610)+text(582,606,'t');
    s+=text(28,656,`N = ${N} · Δz = d/N = ${Number(d/N).toPrecision(4)} µm · ${w.node}`,'class="small"');
    s+=text(28,686,`${w.padding}: ${padding} Δz = ${f(padding*d/N)} µm / side`,'class="small"');
    s+=text(28,716,`${w.outgoing} · ${N>16?(language==='fa'?'بخشی از گره‌ها نمایش داده شده':'subset of nodes shown'):w.schematic}`,'class="small"');
    return svg(w.slab,w.slabView,s,744).replace('<svg ',`<svg data-model="slab" data-cells="${N}" data-padding-cells="${padding}" data-domain-left-um="${-padding*d/N}" data-domain-right-um="${d+padding*d/N}" `);
  }
  function sheet(language='en'){
    const w=words(language==='fa');
    let s=text(28,34,w.sheet,'class="heading"')+text(28,65,w.sheetView,'class="small"');
    s+=`<path d="M180 205L570 205L660 145L270 145Z" fill="#9bd5d4" stroke="#197c87" stroke-width="3"/>`;
    s+=arrow(340,91,340,186)+text(367,117,language==='fa'?'موج فرودی':'Incident wave')+arrow(440,186,440,98)+text(463,123,'r')+arrow(440,225,440,316)+text(463,293,'t');
    s+=text(205,236,'z = 0')+text(400,355,w.dimension,'text-anchor="middle"')+text(400,391,w.sheetNote,'text-anchor="middle" class="small"');
    return svg(w.sheet,w.sheetView,s,420);
  }
  globalThis.BookGeometry={ridge,slab,sheet};
  if(typeof module!=='undefined'&&module.exports)module.exports=globalThis.BookGeometry;

function chart(id,series,options){
 const svg=$(id),W=620,H=330,L=77,R=22,T=20,B=57,x0=L,x1=W-R,y0=H-B,y1=T;

 let ymin=ty(options.ylim?options.ylim[0]:Math.min(...ys)),ymax=ty(options.ylim?options.ylim[1]:Math.max(...ys));if(ymax-ymin<1e-9){ymin-=.001;ymax+=.001;}
 const X=v=>x0+(tx(v)-xmin)/(xmax-xmin)*(x1-x0),Y=v=>y0-(ty(v)-ymin)/(ymax-ymin)*(y0-y1);
 const yt=options.yticks||Array.from({length:5},(_,i)=>ymin+(ymax-ymin)*i/4),xt=options.xticks||[0,16,32,48,64];
 let html=`<title>${esc(options.alt)}</title><defs><clipPath id="clip-${id}"><rect x="${x0}" y="${y1}" width="${x1-x0}" height="${y0-y1}"/></clipPath></defs>`;
 yt.forEach(v=>{const y=options.logY?Y(v):y0-(v-ymin)/(ymax-ymin)*(y0-y1),label=options.logY?'10^'+Math.round(Math.log10(v)):format(v,options.ydigits??3);html+=`<path d="M${x0} ${y}H${x1}" stroke="#e1eaf0"/><text x="${x0-9}" y="${y+4}" text-anchor="end">${esc(label)}</text>`;});
 xt.forEach(v=>{html+=`<path d="M${X(v)} ${y0}v5" stroke="#9eb6c7"/><text x="${X(v)}" y="${y0+22}" text-anchor="middle">${Number(v.toPrecision(5))}</text>`;});
 if(options.selectedX!==undefined)html+=`<path d="M${X(options.selectedX)} ${y1}V${y0}" stroke="#7a94a5" stroke-dasharray="4 4"/>`;
 series.forEach(s=>{const path=s.points.map((p,i)=>(i?'L':'M')+X(p.x)+','+Y(p.y)).join(' ');html+=`<path d="${path}" clip-path="url(#clip-${id})" fill="none" stroke="${s.color}" stroke-width="${s.width||2.3}" ${s.dash?'stroke-dasharray="6 4"':''}/>`;if(s.dots)s.points.forEach(p=>{html+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="2.8" fill="${s.color}"/>`;});if(options.selectedX!==undefined){const p=s.points.find(p=>p.x===options.selectedX);if(p)html+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="${s.color}" stroke="white" stroke-width="1.5"/>`;}});
 html+=`<path d="M${x0} ${y1}V${y0}H${x1}" fill="none" stroke="#9eb6c7"/><text x="${(x0+x1)/2}" y="${H-10}" text-anchor="middle">${esc(options.xlabel)}</text><text transform="translate(17 ${(y0+y1)/2}) rotate(-90)" text-anchor="middle">${esc(options.ylabel)}</text>`;
 svg.innerHTML=html;svg.setAttribute('aria-label',options.alt);
}
