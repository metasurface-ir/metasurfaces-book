function chart(xs,series,xlabel,selected=null,bars=false){

 const ticks=bars?xs:Array.from({length:5},(_,j)=>minx+j*(maxx-minx)/4);
 for(const x of ticks)s+=`<text x="${X(x)}" y="${H-B+25}" text-anchor="middle">${bars?x:fmt(x,lab==='inverse'?0:2)}</text>`;
 series.forEach((a,j)=>{if(bars){const bw=(W-L-R)/xs.length/3;s+=a.values.map((y,i)=>`<rect x="${X(xs[i])+(j-.5)*bw-bw/2}" y="${Y(y)}" width="${bw}" height="${Y(0)-Y(y)}" fill="${palette[j]}"/>`).join('')}else{s+=`<polyline fill="none" stroke="${palette[j]}" stroke-width="3" points="${xs.map((x,i)=>X(x)+','+Y(a.values[i])).join(' ')}"/>`}});
 if(selected!==null)s+=`<path d="M${X(selected)} ${T}V${H-B}" stroke="#5f467d" stroke-width="2" stroke-dasharray="5 5"/>`;

}
