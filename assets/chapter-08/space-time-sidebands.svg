<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="title desc">
  <title id="title">Space–time modulation and scattered frequency channels</title>
  <desc id="desc">An incident carrier reaches a patterned substrate. A periodic bias changes the reflection coefficient and scatters into the carrier and two sidebands. Below are a mounted unit cell, its time-dependent drive, and the three spectral lines of a single-cosine reflection model.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#315a77"/></marker>
    <pattern id="cells" width="39" height="31" patternUnits="userSpaceOnUse"><rect x="6" y="5" width="26" height="20" rx="2" fill="#f0bd55" stroke="#7a541b"/></pattern>
  </defs>
  <rect x="2" y="2" width="796" height="406" rx="18" fill="#f3f8fc" stroke="#becfdc"/>
  <g fill="none" stroke="#315a77" stroke-width="3" marker-end="url(#arrow)">
    <path d="M58 142H254"/><path d="M482 142L682 70"/><path d="M482 142H682"/><path d="M482 142L682 214"/>
  </g>
  <g transform="translate(275 82) skewX(-12)">
    <rect x="0" y="9" width="195" height="124" rx="4" fill="#7294a9"/>
    <rect width="195" height="124" rx="4" fill="#adc8d8" stroke="#315a77"/>
    <rect width="195" height="124" fill="url(#cells)"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="23" fill="#203d55">
    <text x="104" y="126">f₀</text>
    <text x="691" y="77">f₀ + fₘ</text><text x="691" y="149">f₀</text><text x="691" y="221">f₀ − fₘ</text>
    <text x="322" y="350">Γ(x,t)</text>
  </g>
  <path d="M321 300C336 300 336 278 351 278S366 300 381 300 396 322 411 322 426 300 441 300 456 278 471 278 486 300 501 300" fill="none" stroke="#a64432" stroke-width="3"/>
  <path d="M399 273v-48" fill="none" stroke="#315a77" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <path d="M60 293l104-26 83 28-104 27Z" fill="#adc8d8" stroke="#315a77"/>
    <path d="M60 293v15l83 29v-15m0 15l104-27v-15" fill="#7294a9" stroke="#315a77"/>
    <path d="M101 292l63-16 44 15-63 16Z" fill="#f0bd55" stroke="#7a541b"/>
  </g>
  <g fill="none" stroke="#315a77" stroke-width="2" marker-end="url(#arrow)">
    <path d="M531 352H773"/>
    <path d="M547 351V266"/>
  </g>
  <path d="M588 350v-39m70 39v-63m70 63v-39" fill="none" stroke="#a64432" stroke-width="4"/>
  <g fill="#203d55" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle">
    <text x="546" y="254">|Γₙ|</text>
    <text x="588" y="380">f₀ − fₘ</text>
    <text x="658" y="380">f₀</text>
    <text x="728" y="380">f₀ + fₘ</text>
  </g>
</svg>
