<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><title>از دستگاه ممکن تا اندازه‌گیری مستند</title><rect width="1100" height="720" rx="16" fill="#f3f7fa"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087f8c"/></marker></defs><g font-family="Segoe UI,Tahoma,sans-serif"><text x="550" y="36" text-anchor="middle" font-size="25" fill="#18354b">از دستگاه ممکن تا اندازه‌گیری مستند</text><rect x="20" y="60" width="520" height="290" rx="12" fill="white" stroke="#cedbe4"/><rect x="560" y="60" width="520" height="290" rx="12" fill="white" stroke="#cedbe4"/><rect x="20" y="365" width="520" height="290" rx="12" fill="white" stroke="#cedbe4"/><rect x="560" y="365" width="520" height="290" rx="12" fill="white" stroke="#cedbe4"/><text x="280" y="91" text-anchor="middle" font-size="21" fill="#18354b">الف. وصلهٔ زمین‌دار ممکن</text><path d="M55 142L185 125L228 190L98 207Z" fill="#dae7e8"/><path d="M83 151L171 140L200 183L112 195Z" fill="#d49443"/><path d="M55 142V161L98 226V207 M98 226L228 209V190" fill="#9cafb9" stroke="#78909c"/><text x="140" y="255" text-anchor="middle" font-size="16" fill="#18354b">نمای بالا: پهنای w</text><rect x="294" y="166" width="205" height="55" fill="#dbe9e6"/><path d="M333 164H461" stroke="#d49443" stroke-width="9"/><path d="M294 225H499" stroke="#677f8b" stroke-width="7"/><path d="M333 140H461" stroke="#18354b"/><path d="M333 133V147M461 133V147" stroke="#18354b"/><text x="397" y="128" text-anchor="middle" font-size="15" fill="#18354b">w₀ = 5 mm</text><text x="397" y="198" text-anchor="middle" font-size="16" fill="#18354b">εeff,₀ = 3</text><text x="397" y="255" text-anchor="middle" font-size="13" fill="#18354b">مقطع: رسانا / دی‌الکتریک / زمین</text><text x="280" y="319" text-anchor="middle" font-size="16" fill="#8a5620">فقط مفهوم؛ هندسه حل نمی‌شود</text><text x="820" y="91" text-anchor="middle" font-size="21" fill="#18354b">ب. شواهد ساخت را حفظ کنید</text><rect x="582" y="157" width="143" height="74" rx="10" fill="#e6f4f3"/><text x="653" y="200" text-anchor="middle" font-size="17" fill="#18354b">ماسک و ماده</text><path d="M728 194h18" stroke="#087f8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="750" y="157" width="143" height="74" rx="10" fill="#fff0de"/><text x="821" y="200" text-anchor="middle" font-size="17" fill="#18354b">انتقال الگو</text><path d="M896 194h18" stroke="#087f8c" stroke-width="2" marker-end="url(#arrow)"/><rect x="918" y="157" width="143" height="74" rx="10" fill="#eee9f7"/><text x="989" y="200" text-anchor="middle" font-size="17" fill="#18354b">مترولوژی</text><text x="820" y="280" text-anchor="middle" font-size="17" fill="#18354b">پهنا، ارتفاع، دیواره و زبری</text><text x="820" y="319" text-anchor="middle" font-size="16" fill="#8a5620">هندسهٔ اسمی ≠ هندسهٔ ساخته‌شده</text><text x="280" y="398" text-anchor="middle" font-size="21" fill="#18354b">پ. اندازه‌گیری تک‌درگاهی مدل‌شده</text><rect x="40" y="454" width="100" height="70" rx="8" fill="#e5edf3"/><rect x="168" y="454" width="120" height="70" rx="8" fill="#eee9f7"/><text x="90" y="484" text-anchor="middle" font-size="16" fill="#18354b">ابزار</text><text x="228" y="479" text-anchor="middle" font-size="16" fill="#18354b">جعبهٔ خطا</text><text x="228" y="506" text-anchor="middle" font-size="16" fill="#18354b">D, T, S</text><path d="M140 489H168M288 489H490" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><path d="M332 441V546M490 441V546" stroke="#e18431" stroke-width="3" stroke-dasharray="7 5"/><text x="332" y="430" text-anchor="middle" font-size="14" fill="#18354b">صفحهٔ درگاه</text><text x="486" y="430" text-anchor="middle" font-size="14" fill="#18354b">صفحهٔ سطح</text><text x="412" y="470" text-anchor="middle" font-size="15" fill="#18354b">d = 5 mm</text><text x="413" y="540" text-anchor="middle" font-size="14" fill="#18354b">Γport → Γsurface</text><text x="280" y="579" text-anchor="middle" font-size="16" fill="#18354b">سه استاندارد معلوم در صفحهٔ درگاه</text><text x="280" y="615" text-anchor="middle" font-size="16" fill="#18354b">انتشار معلوم: exp(2ikd)</text><text x="820" y="398" text-anchor="middle" font-size="21" fill="#18354b">ت. توسعهٔ جداگانهٔ فضای آزاد</text><path d="M650 458L675 472L642 508L627 483Z M965 458L940 472L973 508L988 483Z" fill="#8ca4b1"/><path d="M653 494L810 586L961 494" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 583H900L928 600H748Z" fill="#dbe9e6"/><path d="M730 586h17l12 9h-17Z" fill="#d49443"/><path d="M755 586h17l12 9h-17Z" fill="#d49443"/><path d="M780 586h17l12 9h-17Z" fill="#d49443"/><path d="M805 586h17l12 9h-17Z" fill="#d49443"/><path d="M830 586h17l12 9h-17Z" fill="#d49443"/><path d="M855 586h17l12 9h-17Z" fill="#d49443"/><path d="M880 586h17l12 9h-17Z" fill="#d49443"/><text x="656" y="438" text-anchor="middle" font-size="16" fill="#18354b">روشن‌سازی</text><text x="966" y="438" text-anchor="middle" font-size="16" fill="#18354b">گیرنده</text><text x="810" y="559" text-anchor="middle" font-size="16" fill="#18354b">نمونهٔ محدود</text><text x="820" y="633" text-anchor="middle" font-size="14" fill="#18354b">زاویه‌ها و قطبش‌ها را جمع‌آوری و نگه‌دارنده را بررسی کنید</text><text x="550" y="694" text-anchor="middle" font-size="16" fill="#18354b">فقط دادهٔ مصنوعی. پنل پ جبر اجراشده و پنل ت توسعهٔ اجرا‌نشده است.</text></g></svg>
